name: Publish container image to GHCR

# Builds the Dockerfile's `run` stage (skips the heavy Playwright/Jasmine test
# stages) and publishes ghcr.io/<owner>/tiddlywiki5. Uses the built-in
# GITHUB_TOKEN — no DockerHub credentials needed.

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  # ---------------------------------------------------------------------------
  # Smoke test: build the run stage and start it the way the Helm chart does
  # (explicit command + args, data dir mounted as a volume), then confirm
  # /status answers. Guards against two regressions that crash-looped before:
  #   1. The image ENTRYPOINT is dumb-init and the "node ./tiddlywiki.js" prefix
  #      lives only in CMD; Kubernetes args replace CMD, so a chart without an
  #      explicit command ran `dumb-init -- /data/wiki ...` and tried to exec
  #      the data directory -> "[dumb-init] /data/wiki: Permission denied".
  #   2. A fresh PVC (non-empty: contains lost+found) was not seeded, so the
  #      server booted without the filesystem/tiddlyweb plugins and silently
  #      dropped writes.
  # The publish job depends on this passing.
  # ---------------------------------------------------------------------------
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build run stage (loaded locally)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          target: run
          load: true
          tags: tiddlywiki5:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Simulate a freshly provisioned ext4 PVC
        run: |
          # A real ext4 PVC is non-empty on first mount: it has lost+found.
          mkdir -p "$PWD/pvc/lost+found"
          # Reproduce the Deployment's initContainers: chown to the runtime user
          # (1000 = node in this image) then seed a real server wiki so writes
          # persist. "--init server" refuses a non-empty dir, so stage + move.
          docker run --rm -v "$PWD/pvc:/data/wiki" busybox:1.36-musl \
            sh -c 'chown -R 1000:1000 /data/wiki'
          docker run --rm -u 1000 -v "$PWD/pvc:/data/wiki" --entrypoint node tiddlywiki5:smoke \
            -e 'const fs=require("fs"),cp=require("child_process");const d="/data/wiki";if(!fs.existsSync(d+"/tiddlywiki.info")){const s=d+"/.tw-init";fs.mkdirSync(s,{recursive:true});cp.execFileSync(process.execPath,["./tiddlywiki.js",s,"--init","server"],{stdio:"inherit"});for(const f of fs.readdirSync(s))fs.renameSync(s+"/"+f,d+"/"+f);fs.rmdirSync(s);}'

      - name: Start container exactly as the chart renders it
        run: |
          # ENTRYPOINT=dumb-init, command=wiki.command, args=dataPath + --listen.
          docker run -d --name tw -u 1000 -p 8080:8080 \
            -v "$PWD/pvc:/data/wiki" \
            tiddlywiki5:smoke \
            node ./tiddlywiki.js /data/wiki --listen host=0.0.0.0 port=8080 gzip=yes use-browser-cache=yes

      - name: Wait for /status (fail fast on crash-loop)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/status >/tmp/status.json 2>/dev/null; then
              echo "status: $(cat /tmp/status.json)"
              if docker logs tw 2>&1 | grep -q "Plugin(s) required for client-server operation are missing"; then
                echo "::error::server started without filesystem/tiddlyweb plugins — fresh PVC not seeded"
                docker logs tw; exit 1
              fi
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' tw 2>/dev/null)" != "true" ]; then
              echo "::error::container exited before serving /status"
              docker logs tw; exit 1
            fi
            sleep 2
          done
          echo "::error::/status never became ready"
          docker logs tw; exit 1

      - name: Dump logs on failure
        if: failure()
        run: docker logs tw || true

  build-and-push:
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/tiddlywiki5"
          SHA="sha-$(git rev-parse --short HEAD)"
          VERSION=$(node -p "require('./package.json').version")
          IS_DEFAULT="${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}"

          BUILD_TAG="${VERSION}.${{ github.run_number }}"

          TAGS="$IMAGE:$SHA"
          if [ "$IS_DEFAULT" = "true" ]; then
            TAGS="$TAGS
          $IMAGE:latest
          $IMAGE:$VERSION
          $IMAGE:$BUILD_TAG"
          fi
          # Also tag on v* git tags
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAGS="$TAGS
          $IMAGE:${{ github.ref_name }}"
          fi

          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "tags<<$EOF" >> "$GITHUB_OUTPUT"
          echo "$TAGS" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Docker metadata (labels only)
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/tiddlywiki5

      - name: Build and push (run stage only)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          target: run
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export build tag
        id: build_tag
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "build_tag=${VERSION}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  bump-chart:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: |
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Compute versions
        id: versions
        run: |
          TW_VERSION=$(node -p "require('./package.json').version")
          BUILD_TAG="${TW_VERSION}.${{ github.run_number }}"

          # Bump the chart patch version (0.1.1 -> 0.1.2) on each build
          CHART_VERSION=$(awk '/^version:/{print $2; exit}' helm/tiddlywiki/Chart.yaml)
          CHART_PATCH=$(echo "$CHART_VERSION" | awk -F. '{print $3}')
          CHART_NEW=$(echo "$CHART_VERSION" | awk -F. -v p="$((CHART_PATCH+1))" '{print $1"."$2"."p}')

          echo "build_tag=$BUILD_TAG" >> "$GITHUB_OUTPUT"
          echo "chart_version=$CHART_NEW" >> "$GITHUB_OUTPUT"
          echo "tw_version=$TW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update Chart.yaml and values.yaml
        run: |
          sed -i "s/^version:.*/version: ${{ steps.versions.outputs.chart_version }}/" helm/tiddlywiki/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${{ steps.versions.outputs.build_tag }}\"/" helm/tiddlywiki/Chart.yaml
          # Update only the main image tag (first occurrence of tag: under image:)
          awk '/^image:/{found=1} found && /^  tag:/{sub(/tag:.*/, "tag: \"${{ steps.versions.outputs.build_tag }}\""); found=0} {print}' \
            helm/tiddlywiki/values.yaml > /tmp/values.yaml && mv /tmp/values.yaml helm/tiddlywiki/values.yaml

      - name: Push branch and open PR
        run: |
          BRANCH="chore/chart-bump-${{ github.run_number }}"
          git checkout -b "$BRANCH"
          git add helm/tiddlywiki/Chart.yaml helm/tiddlywiki/values.yaml
          git commit -m "chore(helm): bump chart to ${{ steps.versions.outputs.chart_version }}, image to ${{ steps.versions.outputs.build_tag }}"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore(helm): bump chart to ${{ steps.versions.outputs.chart_version }}, image to ${{ steps.versions.outputs.build_tag }}" \
            --body "Auto-generated after successful image push. Updates:
          - \`Chart.yaml\` version: \`${{ steps.versions.outputs.chart_version }}\`
          - \`Chart.yaml\` appVersion: \`${{ steps.versions.outputs.build_tag }}\`
          - \`values.yaml\` image.tag: \`${{ steps.versions.outputs.build_tag }}\`" \
            --base master \
            --head "$BRANCH"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
